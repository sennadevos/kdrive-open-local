name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    name: swift test (linux)
    runs-on: ubuntu-latest
    # The official image rather than a setup action: it pins the toolchain exactly and matches
    # what the podman command in the README uses.
    container: docker.io/library/swift:6.4.1
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - run: swift build
        working-directory: host
      - run: swift test
        working-directory: host
      - name: Native messaging framing
        run: tools/smoke-test-framing.sh host/.build/debug/kdrive-open-local

  test-macos:
    name: swift test (macos)
    # The only place the real target platform gets compiled at all, since nobody here has a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build
        working-directory: host
      - run: swift test
        working-directory: host
      - name: Native messaging framing
        run: tools/smoke-test-framing.sh host/.build/debug/kdrive-open-local

  lint-extension:
    name: web-ext lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes web-ext@10.8.0 lint --source-dir extension
