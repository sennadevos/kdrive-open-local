<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: caption; padding: 1em; max-width: 30em; }
      p { color: #666; margin: 0.4em 0 0 1.6em; }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="openFilesDirectly" />
      Open files in their application
    </label>
    <p>
      Off by default: a file is selected in a Finder window instead of opened. That never starts a
      download of an online-only file and never launches an application you did not ask for.
      Folders always open in the Finder either way.
    </p>
    <script src="options.js"></script>
  </body>
</html>
